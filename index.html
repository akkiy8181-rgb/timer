<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>かっこいいタイマー！</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <div class="glass-panel">
      <header>
        <a class="link-btn" href="kanji.html" style="display:inline-block;margin-bottom:0.5rem;color:#00f2fe;text-decoration:none;font-size:0.85rem;border:1px solid #00f2fe;padding:0.3rem 0.8rem;border-radius:99px;">📝 かんじチェッカーへ</a>
        <h1>🎮 レベルアップ・タイマー 🎮</h1>
        <div class="status-board">
          <div class="character-display">
            <div id="speech-bubble" class="speech-bubble">さあ、冒険に出発だ！</div>
            <img id="char-img" src="https://api.dicebear.com/9.x/pixel-art/svg?seed=たびだち" alt="キャラクター" width="96" height="96">
          </div>
          
          <div class="hp-container">
            <span class="hp-label">HP</span>
            <div class="hp-bar-bg">
              <div id="hp-bar-fill" class="hp-bar-fill"></div>
            </div>
            <span id="hp-text">100/100</span>
          </div>

          <div class="level-display">Lv.<span id="level-count">1</span></div>
          <div class="rank-display">ランク：<span id="rank-name">たびだち</span></div>
          <div class="stats-row">
            <div class="session-counter">クリア: <span id="session-count">0</span>回</div>
            <div class="total-time-counter">しゅうちゅう: <span id="total-time-count">0</span>分</div>
            <div class="total-break-counter">やすみ: <span id="total-break-count">0</span>分</div>
          </div>
        </div>
      </header>

      <main>
        <!-- 時間選択ボタン -->
        <div class="time-selectors">
          <div class="selector-group">
            <h3>🔴 しゅうちゅう (分)</h3>
            <div class="btn-group">
              <button class="time-btn work-btn active" data-time="5">5</button>
              <button class="time-btn work-btn" data-time="10">10</button>
              <button class="time-btn work-btn" data-time="15">15</button>
              <button class="time-btn work-btn" data-time="20">20</button>
              <button class="time-btn work-btn" data-time="25">25</button>
              <button class="time-btn work-btn" data-time="30">30</button>
            </div>
          </div>
          <div class="selector-group">
            <h3>🔵 やすみ (分)</h3>
            <div class="btn-group">
              <button class="time-btn break-btn" data-time="5">5</button>
              <button class="time-btn break-btn" data-time="10">10</button>
              <button class="time-btn break-btn" data-time="15">15</button>
            </div>
          </div>
        </div>

        <!-- タイマー表示 -->
        <div class="timer-display-container">
          <svg class="progress-ring" width="240" height="240">
            <defs>
              <linearGradient id="cyber-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00f2fe" />
                <stop offset="100%" stop-color="#4facfe" />
              </linearGradient>
            </defs>
            <circle class="progress-ring-bg" cx="120" cy="120" r="110"></circle>
            <circle class="progress-ring-circle" cx="120" cy="120" r="110"></circle>
          </svg>
          <div class="timer-text" id="timer-display">05:00</div>
          <div class="timer-mode" id="mode-display">しゅうちゅう！</div>
        </div>

        <!-- コントロールボタン -->
        <div class="controls">
          <button id="start-btn" class="control-btn play">▶ スタート</button>
          <button id="pause-btn" class="control-btn pause hidden">⏸ ストップ</button>
          <button id="reset-btn" class="control-btn reset">⏹ リセット</button>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
